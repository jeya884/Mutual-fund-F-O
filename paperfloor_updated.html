<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PaperFloor — F&amp;O Trading Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --panel:#10161D; --panel-alt:#141B23; --border:#1F2A33;
    --text:#C9D3D9; --text-dim:#6B7680; --text-bright:#F1F4F6;
    --gold:#D4A93F; --gold-dim:#8A7233;
    --bull:#2FBF71; --bull-bg:rgba(47,191,113,0.12);
    --bear:#E2564F; --bear-bg:rgba(226,86,79,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; }
  .mono{font-family:'IBM Plex Mono', monospace;}

  #ticker-wrap{ background:#05070A; border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap; padding:9px 0; position:relative; flex-shrink:0; }
  #ticker-wrap::before, #ticker-wrap::after{ content:""; position:absolute; top:0; bottom:0; width:60px; z-index:2; }
  #ticker-wrap::before{ left:0; background:linear-gradient(90deg, #05070A, transparent);}
  #ticker-wrap::after{ right:0; background:linear-gradient(-90deg, #05070A, transparent);}
  #ticker-track{ display:inline-flex; animation: scroll-ticker 90s linear infinite; will-change: transform; }
  @keyframes scroll-ticker{ from{ transform: translateX(0);} to{ transform: translateX(-50%);} }
  .tick-item{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.04em; padding:0 22px; display:inline-flex; align-items:center; gap:7px; color:var(--text-dim); }
  .tick-item .sym{ color:var(--gold); font-weight:600; }
  .tick-item .up{ color:var(--bull); } .tick-item .dn{ color:var(--bear); }
  @media (prefers-reduced-motion: reduce){ #ticker-track{ animation: none; } }

  #app{ flex:1; display:flex; flex-direction:column; }

  .gate{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,169,63,0.08), transparent); }
  .gate-card{ width:100%; max-width:400px; background:var(--panel); border:1px solid var(--border); position:relative; }
  .gate-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--gold), var(--gold-dim), var(--gold)); }
  .gate-head{ padding:32px 32px 20px; border-bottom:1px dashed var(--border); text-align:center; }
  .gate-brand{ font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:34px; letter-spacing:0.03em; color:var(--text-bright); text-transform:uppercase; }
  .gate-brand span{ color:var(--gold); }
  .gate-sub{ font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-dim); margin-top:6px; }
  .gate-body{ padding:28px 32px 32px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:7px; }
  .field input, .field select{ width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-bright); padding:11px 13px; font-family:'IBM Plex Mono', monospace; font-size:14.5px; letter-spacing:0.04em; outline:none; transition:border-color .15s; }
  .field input:focus, .field select:focus{ border-color:var(--gold); }
  .field-hint{ font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
  .btn{ width:100%; padding:12px; background:var(--gold); color:#0A0E14; border:none; font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; transition:filter .15s, transform .05s; }
  .btn:hover{ filter:brightness(1.08); } .btn:active{ transform:translateY(1px); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); filter:none; }
  .btn-sell{ background:var(--bear); color:#fff; } .btn-buy{ background:var(--bull); color:#06170F; }
  .gate-error{ background:var(--bear-bg); border:1px solid var(--bear); color:var(--bear); font-size:12.5px; padding:9px 12px; margin-bottom:16px; display:none; }
  .gate-note{ text-align:center; font-size:11px; color:var(--text-dim); padding:16px 32px 26px; border-top:1px dashed var(--border); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; gap:12px; }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .topbar-brand{ font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:22px; letter-spacing:0.03em; color:var(--text-bright); text-transform:uppercase; }
  .topbar-brand span{ color:var(--gold); }
  .badge-roll{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--text-dim); border:1px solid var(--border); padding:3px 9px; }
  .topbar-right{ display:flex; align-items:center; gap:18px; }
  .cash-pill{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--text-bright); border-left:2px solid var(--gold); padding-left:10px; }
  .cash-pill .lbl{ color:var(--text-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:2px;}
  .logout-btn{ background:none; border:1px solid var(--border); color:var(--text-dim); padding:7px 14px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; }
  .logout-btn:hover{ border-color:var(--bear); color:var(--bear); }

  .tabs{ display:flex; gap:2px; padding:0 26px; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab-btn{ background:none; border:none; color:var(--text-dim); padding:13px 18px; font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-family:'IBM Plex Sans', sans-serif; font-weight:600; }
  .tab-btn.active{ color:var(--gold); border-bottom-color:var(--gold); }
  .tab-btn:hover:not(.active){ color:var(--text-bright); }
  .subtabs{ padding:0; margin-bottom:16px; background:transparent; border-bottom:1px solid var(--border); }

  .content{ flex:1; padding:22px 26px 40px; max-width:1200px; width:100%; margin:0 auto; }
  .section-title{ font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-bright); margin-bottom:14px; }
  .grid-summary{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:26px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); padding:14px 16px; }
  .stat-card .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin-bottom:6px;}
  .stat-card .val{ font-family:'IBM Plex Mono', monospace; font-size:19px; color:var(--text-bright); }
  .stat-card .val.up{ color:var(--bull); } .stat-card .val.dn{ color:var(--bear); }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-dim); padding:10px 12px; border-bottom:1px solid var(--border); font-weight:600; }
  tbody td{ padding:11px 12px; border-bottom:1px solid var(--border); font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--text); vertical-align:middle; }
  tbody tr:hover{ background:var(--panel-alt); }
  .name-sub{ font-family:'IBM Plex Sans',sans-serif; font-size:11px; color:var(--text-dim); }
  .chg.up{ color:var(--bull); } .chg.dn{ color:var(--bear); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .mini-btn{ padding:6px 12px; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; border:none; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; font-weight:700; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); border:1px dashed var(--border); font-size:13px; }
  .table-wrap{ background:var(--panel); border:1px solid var(--border); overflow-x:auto; }
  .sector-head-row td{ background:var(--panel-alt); color:var(--gold); font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-family:'IBM Plex Sans',sans-serif; font-weight:700; padding:9px 12px; }
  .seg-pill{ display:inline-block; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; padding:2px 7px; border:1px solid var(--border); color:var(--text-dim); margin-left:8px; vertical-align:middle;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,7,10,0.75); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal-overlay.show{ display:flex; }
  .modal{ width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border); position:relative; }
  .modal::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; }
  .modal.buy-mode::before{ background:var(--bull); } .modal.sell-mode::before{ background:var(--bear); }
  .modal-head{ padding:20px 22px 14px; border-bottom:1px dashed var(--border); }
  .modal-head .m-sym{ font-family:'Big Shoulders Display',sans-serif; font-size:22px; color:var(--text-bright); font-weight:700;}
  .modal-head .m-price{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-dim); margin-top:4px;}
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:0 22px 22px; display:flex; gap:10px; }
  .modal-foot .btn{ flex:1; }
  .order-total{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-bright); background:var(--panel-alt); border:1px solid var(--border); padding:10px 12px; margin-bottom:16px; display:flex; justify-content:space-between; }
  .close-x{ position:absolute; top:14px; right:16px; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; line-height:1; }
  .close-x:hover{ color:var(--text-bright); }
  .form-err{ color:var(--bear); font-size:11.5px; margin-top:8px; display:none; }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); }
</style>
</head>
<body>

  <div id="ticker-wrap"><div id="ticker-track"></div></div>
  <div id="app"></div>

  <!-- Equity order modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="orderModal">
      <button class="close-x" id="modalClose">&times;</button>
      <div class="modal-head">
        <div class="m-sym" id="mSym">—</div>
        <div class="m-price mono" id="mPrice">LTP ₹0.00</div>
      </div>
      <div class="modal-body">
        <div class="field"><label id="qtyLabel">Quantity</label><input type="number" id="qtyInput" min="1" value="1" /></div>
        <div class="order-total"><span>Order Value</span><span id="orderTotal">₹0.00</span></div>
        <div class="form-err" id="formErr"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="modalCancel">Cancel</button>
        <button class="btn" id="modalSubmit">Confirm</button>
      </div>
    </div>
  </div>

  <!-- F&O order modal -->
  <div class="modal-overlay" id="fnoModalOverlay">
    <div class="modal" id="fnoOrderModal">
      <button class="close-x" id="fnoModalClose">&times;</button>
      <div class="modal-head">
        <div class="m-sym" id="fnoMSym">—</div>
        <div class="m-price mono" id="fnoMPrice">—</div>
      </div>
      <div class="modal-body">
        <div class="field"><label id="fnoLotsLabel">Lots</label><input type="number" id="fnoLotsInput" min="1" value="1" /></div>
        <div class="order-total"><span>Est. Notional</span><span id="fnoOrderTotal">₹0.00</span></div>
        <div class="form-err" id="fnoFormErr"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="fnoModalCancel">Cancel</button>
        <button class="btn" id="fnoModalSubmit">Confirm</button>
      </div>
    </div>
  </div>

/* ===================== STORAGE (works in Claude artifacts AND standalone deploys) ===================== */
const hasArtifactStorage = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';
async function storageGet(key, shared){
  if(hasArtifactStorage){
    try{ return await window.storage.get(key, !!shared); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem((shared?'pf_shared_':'pf_local_') + key);
    return raw !== null ? {key, value: raw, shared: !!shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(hasArtifactStorage){
    try{ return await window.storage.set(key, value, !!shared); }catch(e){ return null; }
  }
  try{
    localStorage.setItem((shared?'pf_shared_':'pf_local_') + key, value);
    return {key, value, shared: !!shared};
  }catch(e){ return null; }
}
async function loadPortfolio(roll){
  try{
    const res = await storageGet('pf_user_' + roll, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(!parsed.fno) parsed.fno = { positions:{}, transactions:[] };
      return parsed;
    }
  }catch(e){ /* no existing record */ }
  return defaultPortfolio();
}
async function savePortfolio(roll, data){
  try{ await storageSet('pf_user_' + roll, JSON.stringify(data), false); }
  catch(e){ console.error('storage save failed', e); }
}

/* ===================== HELPERS ===================== */
function inr(n){ return '₹' + Number(n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function pct(n){ return (n>=0?'+':'') + n.toFixed(2) + '%'; }
function getSpot(sym){
  const idx = INDICES.find(i=>i.sym===sym); if(idx) return idx.ltp;
  const cm = COMMODITIES.find(c=>c.sym===sym); if(cm) return cm.ltp;
  const st = STOCKS.find(s=>s.sym===sym); return st ? st.ltp : 0;
}
function daysToExpiry(){ return Math.max(1, Math.ceil((EXPIRY_DATE - Date.now())/86400000)); }
function futPrice(spot){ return Number((spot*(1 + RISK_FREE*daysToExpiry()/365)).toFixed(2)); }
function erf(x){
  const sign = x<0?-1:1; x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function normCDF(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
function bsPrice(spot,strike,tYears,r,sigma,type){
  if(tYears<=0) tYears=0.0007;
  const d1=(Math.log(spot/strike)+(r+0.5*sigma*sigma)*tYears)/(sigma*Math.sqrt(tYears));
  const d2=d1-sigma*Math.sqrt(tYears);
  const val = type==='CE'
    ? spot*normCDF(d1) - strike*Math.exp(-r*tYears)*normCDF(d2)
    : strike*Math.exp(-r*tYears)*normCDF(-d2) - spot*normCDF(-d1);
  return Math.max(0.05, val);
}
function getOptionChain(underlyingSym){
  const cfg = FNO_UNDERLYINGS.find(u=>u.sym===underlyingSym);
  const spot = getSpot(underlyingSym);
  const step = cfg.strikeStep;
  const atm = Math.round(spot/step)*step;
  const strikes = [];
  for(let i=-5;i<=5;i++) strikes.push(atm+i*step);
  const t = daysToExpiry()/365;
  return strikes.map(k=>({ strike:k, ce:Number(bsPrice(spot,k,t,RISK_FREE,cfg.sigma,'CE').toFixed(2)), pe:Number(bsPrice(spot,k,t,RISK_FREE,cfg.sigma,'PE').toFixed(2)) }));
}

/* ===================== CANDLE HISTORY SEED ===================== */
function pushCandleTick(sym, price){
  const bucket = Math.floor(Date.now()/CANDLE_MS)*CANDLE_MS;
  if(!candleHistory[sym]) candleHistory[sym] = [];
  const arr = candleHistory[sym];
  const last = arr[arr.length-1];
  if(last && last.t===bucket){
    last.h = Math.max(last.h, price);
    last.l = Math.min(last.l, price);
    last.c = price;
  } else {
    arr.push({ t:bucket, o:price, h:price, l:price, c:price });
    if(arr.length>90) arr.shift();
  }
}
function seedCandleHistory(){
  const bucketNow = Math.floor(Date.now()/CANDLE_MS)*CANDLE_MS;
  [...STOCKS, ...INDICES, ...COMMODITIES].forEach(inst=>{
    let p = inst.ltp;
    const bars = [];
    for(let i=44;i>=0;i--){
      const t = bucketNow - i*CANDLE_MS;
      const o = p; let h=o, l=o;
      for(let k=0;k<5;k++){ p = p/(1+(Math.random()-0.5)*0.012); h=Math.max(h,p); l=Math.min(l,p); }
      const c = p;
      bars.push({ t, o:Number(o.toFixed(2)), h:Number(h.toFixed(2)), l:Number(l.toFixed(2)), c:Number(c.toFixed(2)) });
    }
    candleHistory[inst.sym] = bars;
  });
}

function computeHoldingsValue(){
  let value=0, cost=0;
  Object.entries(portfolio.holdings).forEach(([sym,h])=>{
    const stock = STOCKS.find(s=>s.sym===sym);
    if(stock && h.qty>0){ value += stock.ltp*h.qty; cost += h.avgCost*h.qty; }
  });
  return {value, cost, pnl:value-cost};
}
function computeFnoSummary(){
  let marginBlocked=0, unrealizedPnL=0, longOptValue=0;
  Object.values(portfolio.fno.positions).forEach(pos=>{
    const spot = getSpot(pos.underlying);
    if(pos.kind==='FUT'){
      const cur = futPrice(spot);
      const pnl = pos.side==='long' ? (cur-pos.avgPrice)*pos.lots*pos.lotSize : (pos.avgPrice-cur)*pos.lots*pos.lotSize;
      unrealizedPnL += pnl; marginBlocked += pos.margin;
    } else {
      const cfg = FNO_UNDERLYINGS.find(u=>u.sym===pos.underlying);
      const cur = bsPrice(spot, pos.strike, daysToExpiry()/365, RISK_FREE, cfg.sigma, pos.optType);
      if(pos.side==='long'){ longOptValue += cur*pos.lots*pos.lotSize; }
      else { unrealizedPnL += (pos.avgPrice-cur)*pos.lots*pos.lotSize; marginBlocked += pos.margin; }
    }
  });
  return {marginBlocked, unrealizedPnL, longOptValue};
}

  const box = document.getElementById('summaryStats');

  const {value, cost, pnl} = computeHoldingsValue();
  const fno = computeFnoSummary();
  const net = portfolio.cash + value + fno.marginBlocked + fno.unrealizedPnL + fno.longOptValue;

  box.innerHTML = `

function openOrderModal(sym, side){
  const stock = STOCKS.find(s=>s.sym===sym); if(!stock) return;

  modal.className = 'modal ' + (side==='buy' ? 'buy-mode':'sell-mode');
  const submitBtn = document.getElementById('modalSubmit');
  submitBtn.className = 'btn ' + (side==='buy'?'btn-buy':'btn-sell');
  submitBtn.textContent = side==='buy' ? 'Confirm Buy' : 'Confirm Sell';
  updateOrderTotal();
  document.getElementById('modalOverlay').classList.add('show');

function updateOrderTotal(){
  if(!pendingOrder) return;
  const stock = STOCKS.find(s=>s.sym===pendingOrder.sym);
  const qty = Math.max(0, parseInt(document.getElementById('qtyInput').value)||0);
  document.getElementById('orderTotal').textContent = inr(stock.ltp*qty);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); pendingOrder=null; }
async function submitOrder(){
  if(!pendingOrder) return;
  const {sym, side} = pendingOrder;
  const stock = STOCKS.find(s=>s.sym===sym);
  const qty = parseInt(document.getElementById('qtyInput').value)||0;
  const errBox = document.getElementById('formErr');
  if(qty<=0){ errBox.textContent='Enter a quantity greater than zero.'; errBox.style.display='block'; return; }
  const cost = stock.ltp*qty;
  if(side==='buy'){
    if(cost > portfolio.cash){ errBox.textContent='Insufficient cash balance for this order.'; errBox.style.display='block'; return; }
    const existing = portfolio.holdings[sym] || {qty:0, avgCost:0};
    const newQty = existing.qty+qty;
    const newAvg = ((existing.avgCost*existing.qty)+cost)/newQty;
    portfolio.holdings[sym] = {qty:newQty, avgCost:Number(newAvg.toFixed(2))};
    portfolio.cash = Number((portfolio.cash-cost).toFixed(2));
  } else {
    const existing = portfolio.holdings[sym] || {qty:0, avgCost:0};
    if(qty > existing.qty){ errBox.textContent='You only hold '+existing.qty+' shares of '+sym+'.'; errBox.style.display='block'; return; }
    existing.qty -= qty; portfolio.holdings[sym]=existing;
    portfolio.cash = Number((portfolio.cash+cost).toFixed(2));
  }
  portfolio.transactions.push({time:Date.now(), sym, side, qty, price:stock.ltp});
  await savePortfolio(currentRoll, portfolio);
  closeModal(); refreshTabs();
}

  const price = pendingFno.kind==='FUT' ? futPrice(spot) : bsPrice(spot, pendingFno.strike, daysToExpiry()/365, RISK_FREE, cfgSigma, pendingFno.optType);

function closeFnoModal(){ document.getElementById('fnoModalOverlay').classList.remove('show'); pendingFno=null; }
async function submitFnoOrder(){
  if(!pendingFno) return;
  const {kind, underlying, strike, optType, lotSize, side} = pendingFno;
  const lots = parseInt(document.getElementById('fnoLotsInput').value)||0;
  const errBox = document.getElementById('fnoFormErr');
  if(lots<=0){ errBox.textContent='Enter lots greater than zero.'; errBox.style.display='block'; return; }
  const spot = getSpot(underlying);
  const cfgSigma = kind==='OPT' ? FNO_UNDERLYINGS.find(u=>u.sym===underlying).sigma : null;
  const price = kind==='FUT' ? futPrice(spot) : bsPrice(spot, strike, daysToExpiry()/365, RISK_FREE, cfgSigma, optType);
  const key = kind==='FUT' ? underlying+'_FUT' : underlying+'_'+strike+'_'+optType;
  let pos = portfolio.fno.positions[key];
  const actionSide = side==='buy' ? 'long' : 'short';

  if(!pos || pos.lots===0){
    const notional = lots*lotSize*price;
    let marginDelta=0, cashDelta=0;
    if(kind==='FUT'){ marginDelta=notional*0.12; cashDelta=-marginDelta; }
    else if(actionSide==='long'){ cashDelta=-notional; }
    else { marginDelta=notional*0.15; cashDelta=notional-marginDelta; }
    const required = Math.max(0,-cashDelta);
    if(required > portfolio.cash){ errBox.textContent='Insufficient cash. Required: '+inr(required); errBox.style.display='block'; return; }
    portfolio.cash = Number((portfolio.cash+cashDelta).toFixed(2));
    portfolio.fno.positions[key] = {kind, underlying, strike:strike||null, optType:optType||null, lotSize, side:actionSide, lots, avgPrice:price, margin:marginDelta};
  } else if(pos.side===actionSide){
    const notional = lots*lotSize*price;
    let marginDelta=0, cashDelta=0;
    if(kind==='FUT'){ marginDelta=notional*0.12; cashDelta=-marginDelta; }
    else if(actionSide==='long'){ cashDelta=-notional; }
    else { marginDelta=notional*0.15; cashDelta=notional-marginDelta; }
    const required = Math.max(0,-cashDelta);
    if(required > portfolio.cash){ errBox.textContent='Insufficient cash for this addition.'; errBox.style.display='block'; return; }
    portfolio.cash = Number((portfolio.cash+cashDelta).toFixed(2));
    const totalLots = pos.lots+lots;
    pos.avgPrice = ((pos.avgPrice*pos.lots)+(price*lots))/totalLots;
    pos.lots = totalLots; pos.margin += marginDelta;
  } else {
    if(lots > pos.lots){ errBox.textContent='Only '+pos.lots+' lot(s) open. Use Square Off in Positions to close fully.'; errBox.style.display='block'; return; }
    const closeFraction = lots/pos.lots;
    const marginReleased = pos.margin*closeFraction;
    let cashDelta=0;
    if(kind==='FUT'){
      const pnl = pos.side==='long' ? (price-pos.avgPrice)*lots*lotSize : (pos.avgPrice-price)*lots*lotSize;
      cashDelta = marginReleased+pnl;
    } else if(pos.side==='long'){ cashDelta = lots*lotSize*price; }
    else { cashDelta = marginReleased - lots*lotSize*price; }
    portfolio.cash = Number((portfolio.cash+cashDelta).toFixed(2));
    pos.margin -= marginReleased; pos.lots -= lots;
    if(pos.lots<=0) delete portfolio.fno.positions[key];
  }

  portfolio.fno.transactions.push({time:Date.now(), kind, underlying, strike:strike||null, optType:optType||null, side, lots, price:Number(price.toFixed(2)), spotAtEntry:spot});
  await savePortfolio(currentRoll, portfolio);
  closeFnoModal(); refreshTabs();
}
async function squareOffPosition(key){
  const pos = portfolio.fno.positions[key]; if(!pos) return;
  const spot = getSpot(pos.underlying);
  const cfg = pos.kind==='OPT' ? FNO_UNDERLYINGS.find(u=>u.sym===pos.underlying) : null;
  const price = pos.kind==='FUT' ? futPrice(spot) : bsPrice(spot,pos.strike,daysToExpiry()/365,RISK_FREE,cfg.sigma,pos.optType);
  const lots = pos.lots; const marginReleased = pos.margin;
  let cashDelta=0;
  if(pos.kind==='FUT'){
    const pnl = pos.side==='long' ? (price-pos.avgPrice)*lots*pos.lotSize : (pos.avgPrice-price)*lots*pos.lotSize;
    cashDelta = marginReleased+pnl;
  } else if(pos.side==='long'){ cashDelta = lots*pos.lotSize*price; }
  else { cashDelta = marginReleased - lots*pos.lotSize*price; }
  portfolio.cash = Number((portfolio.cash+cashDelta).toFixed(2));
  delete portfolio.fno.positions[key];
  portfolio.fno.transactions.push({time:Date.now(), kind:pos.kind, underlying:pos.underlying, strike:pos.strike||null, optType:pos.optType||null, side: pos.side==='long'?'sell':'buy', lots, price:Number(price.toFixed(2)), spotAtEntry:spot});
  await savePortfolio(currentRoll, portfolio);
  refreshTabs();
}

function getEntriesForSymbol(sym){
  const out = [];
  portfolio.transactions.filter(t=>t.sym===sym).forEach(t=> out.push({t:t.time, price:t.price, buy:t.side==='buy', qty:t.qty, label:sym+' Equity'}));
  portfolio.fno.transactions.filter(t=>t.underlying===sym).forEach(t=>{
    const label = t.kind==='FUT' ? sym+' FUT' : sym+' '+t.strike+' '+t.optType;
    out.push({t:t.time, price:t.spotAtEntry, buy:t.side==='buy', qty:t.lots, label});
  });
  out.sort((a,b)=>a.t-b.t);
  return out;
}
function drawChart(sym){
  const canvas = document.getElementById('priceCanvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth || 600;
  const H = canvas.height = 320;
  ctx.clearRect(0,0,W,H);
  const candles = candleHistory[sym] || [];
  if(candles.length < 2){ ctx.fillStyle='#6B7680'; ctx.font='13px IBM Plex Mono, monospace'; ctx.fillText('Gathering candle data…', 16, H/2); return; }
  const entries = getEntriesForSymbol(sym);
  let pMin = Math.min(...candles.map(c=>c.l));
  let pMax = Math.max(...candles.map(c=>c.h));
  entries.forEach(e=>{ pMin = Math.min(pMin,e.price); pMax = Math.max(pMax,e.price); });
  const pad = (pMax-pMin)*0.12 || pMax*0.02; pMin -= pad; pMax += pad;
  const marginL=62, marginR=14, marginT=14, marginB=22;
  const plotW = W-marginL-marginR, plotH = H-marginT-marginB;
  const n = candles.length;
  const slot = plotW/n;
  const bodyW = Math.max(2, Math.min(14, slot*0.62));
  const xOf = i => marginL + slot*i + slot/2;
  const yOf = p => marginT + plotH - ((p-pMin)/((pMax-pMin)||1))*plotH;

  ctx.strokeStyle = '#1F2A33'; ctx.fillStyle = '#6B7680'; ctx.font = '10px IBM Plex Mono, monospace'; ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const p = pMin + (pMax-pMin)*i/4; const y = yOf(p);
    ctx.beginPath(); ctx.moveTo(marginL,y); ctx.lineTo(W-marginR,y); ctx.stroke();
    ctx.fillText(p.toFixed(p>=1000?0:2), 4, y+3);
  }

  candles.forEach((c,i)=>{
    const x = xOf(i);
    const bullish = c.c >= c.o;
    const color = bullish ? '#2FBF71' : '#E2564F';
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yOf(c.h)); ctx.lineTo(x, yOf(c.l)); ctx.stroke();
    const yO = yOf(c.o), yC = yOf(c.c);
    const top = Math.min(yO,yC), bh = Math.max(1, Math.abs(yC-yO));
    ctx.fillStyle = color;
    ctx.fillRect(x-bodyW/2, top, bodyW, bh);
  });

  entries.forEach(e=>{
    let idx = 0, bestDiff = Infinity;
    candles.forEach((c,i)=>{ const d = Math.abs(c.t-e.t); if(d<bestDiff){ bestDiff=d; idx=i; } });
    const x = xOf(idx), y = yOf(e.price);
    ctx.beginPath(); ctx.fillStyle = e.buy ? '#2FBF71' : '#E2564F';
    if(e.buy){ ctx.moveTo(x-6,y+10); ctx.lineTo(x+6,y+10); ctx.lineTo(x,y-2); }
    else { ctx.moveTo(x-6,y-10); ctx.lineTo(x+6,y-10); ctx.lineTo(x,y+2); }
    ctx.closePath(); ctx.fill();
  });

  if(n>0){
    ctx.fillStyle = '#6B7680'; ctx.font = '9.5px IBM Plex Mono, monospace';
    ctx.textAlign='left';
    ctx.fillText(new Date(candles[0].t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), marginL, H-6);
    ctx.textAlign='right';
    ctx.fillText(new Date(candles[n-1].t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), W-marginR, H-6);
    ctx.textAlign='left';
  }
}
function renderOhlcReadout(sym){
  const box = document.getElementById('ohlcReadout'); if(!box) return;
  const candles = candleHistory[sym] || [];
  if(candles.length===0){ box.innerHTML=''; return; }
  const last = candles[candles.length-1];
  const bullish = last.c >= last.o;
  box.innerHTML = `
    <span class="seg-pill">1m Candles</span>
    <span class="mono" style="margin-left:8px;">O <strong style="color:var(--text-bright);">${inr(last.o)}</strong></span>
    <span class="mono" style="margin-left:10px;">H <strong style="color:var(--bull);">${inr(last.h)}</strong></span>
    <span class="mono" style="margin-left:10px;">L <strong style="color:var(--bear);">${inr(last.l)}</strong></span>
    <span class="mono" style="margin-left:10px;">C <strong style="color:${bullish?'var(--bull)':'var(--bear)'};">${inr(last.c)}</strong></span>`;
}
function refreshChart(){
  drawChart(chartSelectedSym);
  renderOhlcReadout(chartSelectedSym);
  const entries = getEntriesForSymbol(chartSelectedSym);
  const symLabel = document.getElementById('chartEntrySym'); if(symLabel) symLabel.textContent = chartSelectedSym;
  const wrap = document.getElementById('entriesWrap'); if(!wrap) return;
  if(entries.length===0){ wrap.innerHTML = `<div class="empty-state">No trade entries yet for ${chartSelectedSym}.</div>`; return; }
  wrap.innerHTML = `<table><thead><tr><th>Time</th><th>Instrument</th><th>Side</th><th>Qty/Lots</th><th>Price</th></tr></thead>
    <tbody>${[...entries].reverse().map(e=>`<tr><td>${new Date(e.t).toLocaleString('en-IN')}</td><td>${e.label}</td>
      <td class="chg ${e.buy?'up':'dn'}">${e.buy?'BUY':'SELL'}</td><td>${e.qty}</td><td>${inr(e.price)}</td></tr>`).join('')}</tbody></table>`;
}
